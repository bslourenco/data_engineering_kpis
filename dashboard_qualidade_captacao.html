<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qualidade Captação - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 24px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 8px;
        }
        
        .header .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .summary-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #334155;
        }
        
        .summary-card .value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .summary-card .label {
            color: #94a3b8;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .value-total { color: #60a5fa; }
        .value-pass { color: #34d399; }
        .value-fail { color: #f87171; }
        .value-score { color: #fbbf24; }
        
        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        
        .filter-btn:hover {
            border-color: #60a5fa;
            color: #60a5fa;
        }
        
        .filter-btn.active {
            background: #1e40af;
            border-color: #3b82f6;
            color: #fff;
        }
        
        .checks-grid {
            display: grid;
            gap: 16px;
        }
        
        .check-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #334155;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .check-card:hover {
            background: #253349;
        }
        
        .check-card.passed {
            border-left-color: #34d399;
        }
        
        .check-card.failed {
            border-left-color: #f87171;
        }
        
        .check-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .check-name {
            font-weight: 600;
            font-size: 1rem;
        }
        
        .check-badges {
            display: flex;
            gap: 8px;
        }
        
        .badge {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .badge-critical { background: #991b1b; color: #fca5a5; }
        .badge-warning { background: #92400e; color: #fcd34d; }
        .badge-info { background: #1e3a5f; color: #93c5fd; }
        .badge-execucao { background: #1e3a5f; color: #93c5fd; }
        .badge-qualidade { background: #064e3b; color: #6ee7b7; }
        
        .check-detail {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 4px;
        }
        
        .check-meta {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            font-size: 0.8rem;
            color: #64748b;
        }
        
        .check-data {
            display: none;
            margin-top: 16px;
            background: #0f172a;
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
        }
        
        .check-data.visible {
            display: block;
        }
        
        .check-data table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        
        .check-data th {
            text-align: left;
            padding: 8px 12px;
            border-bottom: 1px solid #334155;
            color: #94a3b8;
            font-weight: 600;
        }
        
        .check-data td {
            padding: 6px 12px;
            border-bottom: 1px solid #1e293b;
            color: #cbd5e1;
        }
        
        .status-icon {
            font-size: 1.2rem;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #475569;
            font-size: 0.8rem;
        }
    </style>
</head>

    // Render summary
    function renderSummary() {
        const summary = document.getElementById('summary');
        const r = dados.resumo;
        const score = r.total > 0 ? Math.round((r.passou / r.total) * 100) : 0;
        
        summary.innerHTML = `
            <div class="summary-card">
                <div class="value value-total">${r.total}</div>
                <div class="label">Total de Checks</div>
            </div>
            <div class="summary-card">
                <div class="value value-pass">${r.passou}</div>
                <div class="label">Aprovados</div>
            </div>
            <div class="summary-card">
                <div class="value value-fail">${r.falhou}</div>
                <div class="label">Falhas</div>
            </div>
            <div class="summary-card">
                <div class="value value-score">${score}%</div>
                <div class="label">Score de Saúde</div>
            </div>
        `;
    }
    
    // Render filters
    function renderFilters() {
        const filters = document.getElementById('filters');
        filters.innerHTML = `
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" data-filter="failed">❌ Falhas</button>
            <button class="filter-btn" data-filter="passed">✅ Aprovados</button>
            <button class="filter-btn" data-filter="execucao">🔄 Execução</button>
            <button class="filter-btn" data-filter="qualidade">📊 Qualidade</button>
            <button class="filter-btn" data-filter="critical">🔴 Críticos</button>
        `;
        
        filters.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                filters.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderChecks(btn.dataset.filter);
            });
        });
    }
    
    // Render checks
    function renderChecks(filter = 'all') {
        const grid = document.getElementById('checks-grid');
        let checks = dados.checks;
        
        if (filter === 'failed') checks = checks.filter(c => !c.passou);
        else if (filter === 'passed') checks = checks.filter(c => c.passou);
        else if (filter === 'execucao') checks = checks.filter(c => c.categoria === 'execucao');
        else if (filter === 'qualidade') checks = checks.filter(c => c.categoria === 'qualidade');
        else if (filter === 'critical') checks = checks.filter(c => c.severidade === 'critical');
        
        grid.innerHTML = checks.map((check, idx) => {
            const statusClass = check.passou ? 'passed' : 'failed';
            const icon = check.passou ? '✅' : '❌';
            const dataTable = check.dados ? buildDataTable(check.dados) : '';
            
            return `
                <div class="check-card ${statusClass}" onclick="toggleData(${idx})">
                    <div class="check-header">
                        <span class="check-name"><span class="status-icon">${icon}</span> ${check.nome}</span>
                        <div class="check-badges">
                            <span class="badge badge-${check.categoria}">${check.categoria}</span>
                            <span class="badge badge-${check.severidade}">${check.severidade}</span>
                        </div>
                    </div>
                    <div class="check-detail">${check.detalhe}</div>
                    <div class="check-meta">
                        ${check.esperado ? `<span>Esperado: ${check.esperado}</span>` : ''}
                        ${check.encontrado ? `<span>Encontrado: ${check.encontrado}</span>` : ''}
                    </div>
                    ${dataTable ? `<div class="check-data" id="data-${idx}">${dataTable}</div>` : ''}
                </div>
            `;
        }).join('');
    }
    
    function buildDataTable(data) {
        if (!data || data.length === 0) return '';
        const headers = Object.keys(data[0]);
        return `
            <table>
                <thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
                <tbody>${data.map(row => 
                    `<tr>${headers.map(h => `<td>${row[h] || '-'}</td>`).join('')}</tr>`
                ).join('')}</tbody>
            </table>
        `;
    }
    
    function toggleData(idx) {
        const el = document.getElementById(`data-${idx}`);
        if (el) el.classList.toggle('visible');
    }
    
    // Init
    document.getElementById('dt-geracao').textContent = new Date(dados.dt_execucao).toLocaleString('pt-BR');
    renderSummary();
    renderFilters();
    renderChecks();
    </script>
</body>
